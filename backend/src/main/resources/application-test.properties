spring.config.activate.on-profile=test
spring.datasource.url=jdbc:h2:mem:cputhome_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=32MB

app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=cput-home-test-secret-that-is-at-least-32-chars-long
app.jwt.expiry-ms=3600000
app.media.upload-dir=./uploads-test
app.admin.email=
app.admin.password=

logging.level.com.cputhome=WARN

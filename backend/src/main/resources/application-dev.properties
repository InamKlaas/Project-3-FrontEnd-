spring.config.activate.on-profile=dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cput_home?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:baggetter23}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=32MB

management.endpoints.web.exposure.include=health,info

server.port=8080

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:cput-home-local-dev-secret-that-is-at-least-32-chars-long}
app.jwt.expiry-ms=${JWT_EXPIRY:86400000}
app.media.upload-dir=${MEDIA_UPLOAD_DIR:./uploads}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

logging.level.com.cputhome=INFO
logging.level.org.hibernate.SQL=WARN
